# ============================================
# 开发环境配置
# 启动命令：java -jar app.jar --spring.profiles.active=dev
# ============================================

spring:
  # 数据库配置（开发环境）
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/game_db?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:gameuser}
    password: ${DB_PASSWORD:123456}

  # JPA 配置（开发环境）
  jpa:
    hibernate:
      ddl-auto: create-drop  # 开发环境允许自动更新表结构
    show-sql: false     # 不显示 SQL 语句
    properties:
      hibernate.format_sql: false        # 不格式化 SQL 输出
      hibernate.show_sql: false          # 明确禁用 SQL 输出
      hibernate.use_sql_comments: false  # 禁用 SQL 注释
      hibernate.highlight_sql: false     # 禁用 SQL 高亮

  # Redis 配置（开发环境）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}  # 开发环境可以无密码

# CORS 配置（开发环境 - 允许所有来源）
cors:
  allowed-origins: '*'

# JWT 配置（开发环境 - 使用简单的密钥）
jwt:
  secret: ${JWT_SECRET:dev-secret-key-for-development-only-do-not-use-in-production}

# 日志配置（开发环境 - 精简日志）
logging:
  level:
    root: WARN                      # 框架只显示警告和错误
    org.example: INFO               # 项目代码显示 INFO 及以上
    org.hibernate: WARN             # Hibernate 只显示警告
    org.hibernate.SQL: OFF          # 🔥 完全禁用 SQL 日志
    org.hibernate.type: OFF         # 🔥 禁用 SQL 参数绑定日志
    org.hibernate.stat: OFF         # 🔥 禁用 Hibernate 统计日志
    org.springframework: WARN       # Spring 只显示警告
    com.zaxxer.hikari: WARN         # HikariCP 只显示警告
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
